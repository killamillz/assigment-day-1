<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Todo List</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header>
    <h1>My Todo List</h1>
    <button id="themeBtn" title="Toggle dark mode">🌙</button>
  </header>
  <p class="subtitle" id="subtitle">Let's get things done.</p>

  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="200">
    <button id="addBtn" title="Add task">+</button>
  </div>

  <div class="due-row">
    <label for="dueInput">Complete by</label>
    <input type="datetime-local" id="dueInput">
    <button id="clearDueBtn" title="Clear the date">✕</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">All <span class="count" data-count="all"></span></button>
    <button class="filter-btn" data-filter="active">Active <span class="count" data-count="active"></span></button>
    <button class="filter-btn" data-filter="completed">Done <span class="count" data-count="completed"></span></button>
  </div>

  <ul id="taskList"></ul>

  <div class="footer">
    <span id="itemsLeft">0 items left</span>
    <button id="clearBtn">Clear completed</button>
  </div>
</div>

<div id="toast"><span id="toastText"></span><button id="undoBtn">Undo</button></div>

<script src="app.js"></script>
</body>
</html>
