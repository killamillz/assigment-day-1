<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TO-DO</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Poppins font-family link -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="body-container">
      <header class="container">
        <h1 class="head">Group 3 Todo Lists</h1>
      </header>

      <div class="container">
        <h2 class="section-label">Todos</h2>

        <ul class="todos"></ul>
      </div>

      <div class="container">
        <h2 class="section-label">Completed Todos</h2>

        <ul class="completed-todos"></ul>
      </div>

      <div class="container add-container">
        <form class="add" action="">
          <label class="add-label" for="add">Add Todos...</label>

          <div class="add-row">
            <input class="text-input" type="text" placeholder="" name="add" />

            <input class="time-input" type="time" name="add-time" />
          </div>

          <button type="button" class="btn add-btn">Add</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.0/iconify-icon.min.js"></script>
  </body>
</html>
